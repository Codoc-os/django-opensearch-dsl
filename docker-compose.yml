services:

  opensearch_test_10_0:
    container_name: opensearch_test_10_0
    image: opensearchproject/opensearch:1
    ports:
      - "9210:9200"
      - "9610:9600"
    environment:
      - plugins.security.disabled=true
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms128m -Xmx128m"

